name: ci-web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Browser matrix, accessibility, and live reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Type-check React islands
        run: npm run typecheck
        working-directory: web
      - name: Unit-test island formatters
        run: npm run test:unit
        working-directory: web
      - name: Install browsers
        # Chromium and WebKit are the two engines docs/browser-support.md
        # declares. Firefox shares neither and is deliberately not tested.
        run: npx playwright install --with-deps chromium webkit
        working-directory: web
      - name: Run browser matrix, accessibility sweep, and reconciliation
        # One invocation for every project: the webServer block boots the Go
        # server once and shares it. Splitting this into per-project steps
        # would re-pay the `go run` compile each time.
        run: npm run test:e2e
        working-directory: web
      - name: Upload Playwright report
        # An axe violation is not diagnosable from the GitHub annotation alone.
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
