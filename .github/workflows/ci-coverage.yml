name: ci-coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (50% aggregate floor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run coverage suite
        run: go test -short -coverprofile=coverage.out ./...
      - name: Enforce aggregate threshold
        shell: bash
        run: |
          go tool cover -func=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          if [[ -z "$total" ]] || ! awk -v total="$total" 'BEGIN { exit !(total + 0 >= 50) }'; then
            printf 'Aggregate statement coverage %s%% is below the 50%% floor.\n' "${total:-unknown}"
            exit 1
          fi
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: error
          retention-days: 14
