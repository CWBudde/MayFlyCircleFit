name: CI

# Orchestrator only. Every gate lives in its own reusable workflow next to this
# file, named ci-<concern>.yml, so one gate can be edited without touching the
# others. The job keys below must keep matching the release job's needs list;
# `needs:` cannot cross workflow-file boundaries, which is why release stays here
# rather than moving into a file of its own.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generation:
    uses: ./.github/workflows/ci-generation.yml

  bundle:
    uses: ./.github/workflows/ci-bundle.yml

  web:
    uses: ./.github/workflows/ci-web.yml

  quality:
    uses: ./.github/workflows/ci-quality.yml

  staticcheck:
    uses: ./.github/workflows/ci-staticcheck.yml

  lint:
    uses: ./.github/workflows/ci-lint.yml

  test:
    uses: ./.github/workflows/ci-test.yml

  benchmarks:
    uses: ./.github/workflows/ci-benchmarks.yml

  e2e:
    uses: ./.github/workflows/ci-e2e.yml

  coverage:
    uses: ./.github/workflows/ci-coverage.yml

  race:
    uses: ./.github/workflows/ci-race.yml

  build:
    uses: ./.github/workflows/ci-build.yml

  cross-build:
    uses: ./.github/workflows/ci-cross-build.yml

  native-simd:
    uses: ./.github/workflows/ci-native-simd.yml

  gpu-compile:
    uses: ./.github/workflows/ci-gpu-compile.yml

  vulnerability:
    uses: ./.github/workflows/ci-vulnerability.yml

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    # benchmarks is deliberately absent: the timing comparison is report-only
    # and must never gate a release. lint is absent for now because
    # golangci-lint only reports pull-request-new issues while the `default =
    # all` backlog is being worked down; see ci-lint.yml.
    needs:
      - generation
      - bundle
      - web
      - quality
      - staticcheck
      - test
      - e2e
      - coverage
      - race
      - build
      - cross-build
      - native-simd
      - gpu-compile
      - vulnerability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag and source commit
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf 'Release tag is not valid SemVer: %s\n' "$tag"
            exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
            printf 'Tagged commit %s is not part of master.\n' "$GITHUB_SHA"
            exit 1
          fi
      - name: Build and verify release archives
        shell: bash
        env:
          MAYFLY_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          export MAYFLY_RELEASE_BUILD_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          bash scripts/build-release.sh "${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Create draft and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "${prerelease[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false
