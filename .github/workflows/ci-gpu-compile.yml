name: ci-gpu-compile

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gpu-compile:
    name: GPU-tag OpenCL (PoCL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install OpenCL development headers and PoCL runtime
        # This step pulls three packages and touches no repository code, yet it
        # is the one that has stalled the gate: on 2026-08-19 `apt-get update`
        # went silent mid-transfer on a 126 kB InRelease file, after the azure
        # mirror had already been ignored, and produced nothing further until
        # the job's own 20-minute timeout. It happened three times in an
        # afternoon, on unrelated commits.
        #
        # The acquire timeouts are what turn that silence into a failure apt can
        # act on, since a stalled connection is not a refused one; the retries
        # then ride out a mirror that is merely having a bad minute. The step
        # timeout bounds the worst case well short of the job's, so a mirror
        # outage reports as this step rather than as the GPU gate timing out
        # with no explanation.
        timeout-minutes: 6
        run: |
          apt_get() {
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              "$@"
          }
          for attempt in 1 2 3; do
            if apt_get update && apt_get install --yes --no-install-recommends \
                clinfo \
                ocl-icd-opencl-dev \
                pocl-opencl-icd; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed" >&2
            # An explicit if, not `[ ... ] && sleep`: the run step is bash -e,
            # where a false test as the last command of the body would exit the
            # step silently instead of reaching the message below.
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "the OpenCL runtime could not be installed after 3 attempts" >&2
          exit 1
      - name: Verify PoCL platform discovery
        shell: bash
        run: |
          platforms="$(clinfo -l)"
          printf '%s\n' "$platforms"
          grep -q 'Platform #' <<<"$platforms"
          grep -q 'Device #' <<<"$platforms"
      - name: Compile GPU-tagged packages and tests
        run: go test -tags gpu -run '^$' ./...
      - name: Check every gpu-tagged test is reachable by the focused selector
        # The step below selects by name, which is a silent failure mode: a
        # gpu-tagged test whose name does not match simply never runs, and
        # nothing reports it. That is not hypothetical --
        # TestDegradationIsSharedBetweenARendererAndItsSessions sat unrun until
        # it was renamed, and it was the only test asserting an invariant shared
        # across sessions.
        #
        # The file list comes from the build constraint rather than a filename
        # pattern, because *_gpu_test.go is a convention too.
        shell: bash
        run: |
          selector='^TestOpenCL|^TestPackReferenceNRGBA'
          files="$(grep -rl '^//go:build gpu' internal/fit/renderer --include='*_test.go')"
          if [ -z "$files" ]; then
            echo "no gpu-tagged test files found: the check is looking in the wrong place" >&2
            exit 1
          fi
          # Piped into xargs rather than expanded as $files, so the check cannot
          # pass vacuously if the list is ever handled as a single word.
          unreachable="$(printf '%s\n' "$files" \
            | xargs grep -hoE '^func Test[A-Za-z0-9_]*' \
            | awk '{print $2}' | grep -Ev "$selector" || true)"
          if [ -n "$unreachable" ]; then
            echo "these gpu-tagged tests do not match the focused selector and would never run:" >&2
            printf '%s\n' "$unreachable" >&2
            echo "rename them to start with TestOpenCL, or widen the selector deliberately." >&2
            exit 1
          fi
          echo "every gpu-tagged test matches ${selector}"
      - name: Run focused OpenCL runtime tests
        env:
          CIRCLEFIT_REQUIRE_OPENCL: "1"
        run: go test -tags gpu -count=1 ./internal/fit/renderer/... -run '^TestOpenCL|^TestPackReferenceNRGBA'
