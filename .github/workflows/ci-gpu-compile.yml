name: ci-gpu-compile

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gpu-compile:
    name: GPU-tag OpenCL (PoCL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install OpenCL development headers and PoCL runtime
        # This step pulls three packages and touches no repository code, yet it
        # is the one that has stalled the gate: on 2026-08-19 `apt-get update`
        # went silent mid-transfer on a 126 kB InRelease file, after the azure
        # mirror had already been ignored, and produced nothing further until
        # the job's own 20-minute timeout. It happened three times in an
        # afternoon, on unrelated commits.
        #
        # The acquire timeouts are what turn that silence into a failure apt can
        # act on, since a stalled connection is not a refused one; the retries
        # then ride out a mirror that is merely having a bad minute. The step
        # timeout bounds the worst case well short of the job's, so a mirror
        # outage reports as this step rather than as the GPU gate timing out
        # with no explanation.
        timeout-minutes: 6
        run: |
          apt_get() {
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              "$@"
          }
          for attempt in 1 2 3; do
            if apt_get update && apt_get install --yes --no-install-recommends \
                clinfo \
                ocl-icd-opencl-dev \
                pocl-opencl-icd; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed" >&2
            # An explicit if, not `[ ... ] && sleep`: the run step is bash -e,
            # where a false test as the last command of the body would exit the
            # step silently instead of reaching the message below.
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "the OpenCL runtime could not be installed after 3 attempts" >&2
          exit 1
      - name: Verify PoCL platform discovery
        shell: bash
        run: |
          platforms="$(clinfo -l)"
          printf '%s\n' "$platforms"
          grep -q 'Platform #' <<<"$platforms"
          grep -q 'Device #' <<<"$platforms"
      - name: Compile GPU-tagged packages and tests
        run: go test -tags gpu -run '^$' ./...
      - name: Run focused OpenCL runtime tests
        env:
          CIRCLEFIT_REQUIRE_OPENCL: "1"
        run: go test -tags gpu -count=1 ./internal/fit/renderer/... -run '^TestOpenCL|^TestPackReferenceNRGBA'
