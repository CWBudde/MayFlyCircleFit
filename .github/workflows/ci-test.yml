name: ci-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Short tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -short ./...
