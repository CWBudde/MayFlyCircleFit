name: ci-race

on:
  workflow_call:

permissions:
  contents: read

jobs:
  race:
    name: Race detector (short)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -short ./...
