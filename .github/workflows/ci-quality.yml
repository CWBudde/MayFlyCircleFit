name: ci-quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Format and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -s -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Files need gofmt -s:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
