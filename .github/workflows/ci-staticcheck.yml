name: ci-staticcheck

on:
  workflow_call:

permissions:
  contents: read

jobs:
  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
      - run: staticcheck ./...
