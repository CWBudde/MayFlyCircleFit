name: ci-native-simd

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-simd:
    name: Native SSD (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux AMD64 / AVX2
            runner: ubuntu-24.04
            backend: AVX2
            maskedBackend: SSE2
            sse2Tier: "yes"
          - platform: macOS ARM64 / NEON
            runner: macos-15
            backend: NEON
            maskedBackend: scalar
            sse2Tier: ""
          - platform: Windows AMD64 / AVX2
            runner: windows-2025
            backend: AVX2
            maskedBackend: SSE2
            sse2Tier: "yes"
          - platform: Linux ARM64 / NEON
            runner: ubuntu-24.04-arm
            backend: NEON
            maskedBackend: scalar
            sse2Tier: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run SSD tests on native hardware
        env:
          CGO_ENABLED: "0"
          MAYFLY_REQUIRE_SSD_BACKEND: ${{ matrix.backend }}
        run: go test -count=1 ./internal/fit
      # golang.org/x/sys/cpu marks sse2 Required on amd64, so cpu.all=off leaves
      # cpu.X86.HasSSE2 set and amd64 dispatch drops to SSE2 rather than scalar.
      # The expected backend is therefore per-runner, and only MAYFLY_DISABLE_SIMD
      # below gates the complete scalar fallback on every architecture.
      - name: Run SSD tests with maskable CPU features disabled
        env:
          CGO_ENABLED: "0"
          GODEBUG: cpu.all=off
          MAYFLY_REQUIRE_SSD_BACKEND: ${{ matrix.maskedBackend }}
        run: go test -count=1 ./internal/fit
      - name: Run SSD tests with the SSE2 tier forced
        if: matrix.sse2Tier != ''
        env:
          CGO_ENABLED: "0"
          GODEBUG: cpu.avx2=off
          MAYFLY_REQUIRE_SSD_BACKEND: SSE2
        # This step is amd64-only (sse2Tier is set on the amd64 rows), so it can
        # cover the renderer too. Without ./internal/fit/renderer the renderer's
        # SSE2 delta-SSD and circle-span dispatch never runs in the SSE2
        # configuration and its SSE2 tests self-skip on an AVX2 host.
        run: go test -count=1 ./internal/fit ./internal/fit/renderer
      # This deliberately covers ./internal/fit only. Widening it to
      # ./internal/fit/renderer is the right end state, because MAYFLY_DISABLE_SIMD
      # claims to force the scalar backend for every kernel and the renderer has
      # its own gates. Doing so was tried and turned the ARM64 runners red on
      # TestCPURendererMatchesPreOptimizationBaseline/fractional_overlaps, which
      # is an unrelated pre-existing defect: this matrix is the only ARM64 CI
      # coverage in the repository, every other job is ubuntu-latest, so the
      # renderer package has never executed on ARM64 here. See
      # docs/known-limitations.md; widen this once that is fixed on real hardware.
      - name: Run SSD tests with SIMD disabled entirely
        env:
          CGO_ENABLED: "0"
          MAYFLY_DISABLE_SIMD: "1"
          MAYFLY_REQUIRE_SSD_BACKEND: scalar
        run: go test -count=1 ./internal/fit
      - name: Record native scalar and SIMD throughput
        env:
          CGO_ENABLED: "0"
          MAYFLY_REQUIRE_SSD_BACKEND: ${{ matrix.backend }}
        run: go test -run '^$' -bench '^BenchmarkFastSSD_Comparison$' -benchtime=200ms -count=1 ./internal/fit
