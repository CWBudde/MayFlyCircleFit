name: ci-native-simd

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-simd:
    name: Native SSD (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux AMD64 / AVX2
            runner: ubuntu-24.04
            backend: AVX2
            maskedBackend: SSE2
            sse2Tier: "yes"
          - platform: macOS ARM64 / NEON
            runner: macos-15
            backend: NEON
            maskedBackend: scalar
            sse2Tier: ""
          - platform: Windows AMD64 / AVX2
            runner: windows-2025
            backend: AVX2
            maskedBackend: SSE2
            sse2Tier: "yes"
          - platform: Linux ARM64 / NEON
            runner: ubuntu-24.04-arm
            backend: NEON
            maskedBackend: scalar
            sse2Tier: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run SSD tests on native hardware
        env:
          CGO_ENABLED: "0"
          MAYFLY_REQUIRE_SSD_BACKEND: ${{ matrix.backend }}
        run: go test -count=1 ./internal/fit
      # golang.org/x/sys/cpu marks sse2 Required on amd64, so cpu.all=off leaves
      # cpu.X86.HasSSE2 set and amd64 dispatch drops to SSE2 rather than scalar.
      # The expected backend is therefore per-runner, and only MAYFLY_DISABLE_SIMD
      # below gates the complete scalar fallback on every architecture.
      - name: Run SSD tests with maskable CPU features disabled
        env:
          CGO_ENABLED: "0"
          GODEBUG: cpu.all=off
          MAYFLY_REQUIRE_SSD_BACKEND: ${{ matrix.maskedBackend }}
        run: go test -count=1 ./internal/fit
      - name: Run SSD tests with the SSE2 tier forced
        if: matrix.sse2Tier != ''
        env:
          CGO_ENABLED: "0"
          GODEBUG: cpu.avx2=off
          MAYFLY_REQUIRE_SSD_BACKEND: SSE2
        run: go test -count=1 ./internal/fit
      # The renderer package is included because MAYFLY_DISABLE_SIMD claims to
      # force the scalar backend for every kernel, not only the SSD one. Its
      # span compositor, delta-SSD, and circle-span dispatchers each have their
      # own gate, so only running ./internal/fit would leave that claim untested.
      # MAYFLY_REQUIRE_SSD_BACKEND is read solely by ./internal/fit and is inert
      # for the renderer package.
      - name: Run SSD and renderer tests with SIMD disabled entirely
        env:
          CGO_ENABLED: "0"
          MAYFLY_DISABLE_SIMD: "1"
          MAYFLY_REQUIRE_SSD_BACKEND: scalar
        run: go test -count=1 ./internal/fit ./internal/fit/renderer
      - name: Record native scalar and SIMD throughput
        env:
          CGO_ENABLED: "0"
          MAYFLY_REQUIRE_SSD_BACKEND: ${{ matrix.backend }}
        run: go test -run '^$' -bench '^BenchmarkFastSSD_Comparison$' -benchtime=200ms -count=1 ./internal/fit
