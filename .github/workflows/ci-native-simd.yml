name: ci-native-simd

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-simd:
    name: Native SSD (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux AMD64 / AVX2
            runner: ubuntu-24.04
            backend: AVX2
          - platform: macOS ARM64 / NEON
            runner: macos-15
            backend: NEON
          - platform: Windows AMD64 / AVX2
            runner: windows-2025
            backend: AVX2
          - platform: Linux ARM64 / NEON
            runner: ubuntu-24.04-arm
            backend: NEON
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run SSD tests on native hardware
        env:
          CGO_ENABLED: "0"
          MAYFLY_REQUIRE_SSD_BACKEND: ${{ matrix.backend }}
        run: go test -count=1 ./internal/fit
      - name: Run SSD tests with SIMD features disabled
        env:
          CGO_ENABLED: "0"
          GODEBUG: cpu.all=off
          MAYFLY_REQUIRE_SSD_BACKEND: scalar
        run: go test -count=1 ./internal/fit
      - name: Record native scalar and SIMD throughput
        env:
          CGO_ENABLED: "0"
          MAYFLY_REQUIRE_SSD_BACKEND: ${{ matrix.backend }}
        run: go test -run '^$' -bench '^BenchmarkFastSSD_Comparison$' -benchtime=200ms -count=1 ./internal/fit
