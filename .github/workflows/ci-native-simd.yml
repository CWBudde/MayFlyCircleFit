name: ci-native-simd

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-simd:
    name: Native SSD (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux AMD64 / AVX2
            runner: ubuntu-24.04
            tier: avx2
            # golang.org/x/sys/cpu marks sse2 Required on amd64 and ORs the
            # requirement back in after processing GODEBUG, so masking every
            # maskable feature demotes this runner to SSE2, not to scalar.
            maskedTier: sse2
            # Only amd64 has a tier between the widest one and scalar.
            middleTier: sse2
            rendererPackage: ./internal/fit/renderer
          - platform: macOS ARM64 / NEON
            runner: macos-15
            tier: neon
            maskedTier: scalar
            middleTier: ""
            rendererPackage: ./internal/fit/renderer
          - platform: Windows AMD64 / AVX2
            runner: windows-2025
            tier: avx2
            maskedTier: sse2
            middleTier: sse2
            rendererPackage: ./internal/fit/renderer
          - platform: Linux ARM64 / NEON
            runner: ubuntu-24.04-arm
            tier: neon
            maskedTier: scalar
            middleTier: ""
            rendererPackage: ./internal/fit/renderer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # CIRCLEFIT_REQUIRE_SIMD_TIER asserts which tier was detected; it never sets
      # one. CIRCLEFIT_SIMD_TIER, used further down, is the opposite: it pins the
      # tier, so asserting against it would be a tautology. Every step below
      # pairs exactly one of the two with the assertion.
      #
      # The pair replaces MAYFLY_REQUIRE_SSD_BACKEND, which named one kernel in
      # one package. Setting it while running internal/fit/renderer asserted
      # nothing at all about the renderer's own dispatch.
      - name: Detected tier on native hardware
        env:
          CGO_ENABLED: "0"
          CIRCLEFIT_REQUIRE_SIMD_TIER: ${{ matrix.tier }}
        run: go test -count=1 ./internal/fit ${{ matrix.rendererPackage }}

      # This is a detection check, not a dispatch check: it proves that masking
      # the CPU feature bits still moves the detected tier where the
      # documentation says it does. Dispatch across tiers is covered in-process
      # by the forced-tier tests, which need no separate CI step.
      - name: Detected tier with maskable CPU features disabled
        env:
          CGO_ENABLED: "0"
          GODEBUG: cpu.all=off
          CIRCLEFIT_REQUIRE_SIMD_TIER: ${{ matrix.maskedTier }}
        run: go test -count=1 ./internal/fit

      - name: Middle tier pinned
        if: matrix.middleTier != ''
        env:
          CGO_ENABLED: "0"
          CIRCLEFIT_SIMD_TIER: ${{ matrix.middleTier }}
          CIRCLEFIT_REQUIRE_SIMD_TIER: ${{ matrix.middleTier }}
        run: go test -count=1 ./internal/fit ${{ matrix.rendererPackage }}

      - name: Scalar tier pinned
        env:
          CGO_ENABLED: "0"
          CIRCLEFIT_SIMD_TIER: scalar
          CIRCLEFIT_REQUIRE_SIMD_TIER: scalar
        run: go test -count=1 ./internal/fit ${{ matrix.rendererPackage }}

      # CIRCLEFIT_DISABLE_SIMD is the older lever and now means exactly
      # CIRCLEFIT_SIMD_TIER=scalar. It is kept working, and kept gated, because
      # operator notes and external scripts already use it.
      - name: Legacy scalar opt-out still reaches the scalar tier
        env:
          CGO_ENABLED: "0"
          CIRCLEFIT_DISABLE_SIMD: "1"
          CIRCLEFIT_REQUIRE_SIMD_TIER: scalar
        run: go test -count=1 ./internal/fit

      # internal/fit/renderer now runs on all four rows, including the two
      # ARM64 ones. It could not before: the renderer's float64 arithmetic was
      # written so ARM64 would contract each multiply-add into a single fused
      # operation, matching the NEON span kernel but matching neither amd64 nor
      # the correctness oracle, which rounds with math.Round and cannot fuse.
      # That showed up as
      #
      #   --- FAIL: TestCPURendererMatchesPreOptimizationBaseline/fractional_overlaps
      #       renderer_correctness_test.go:109: pixel (4,11) channel 3 = 205, baseline = 206
      #
      # plus a second failure in TestPolishCircleBatchPoolWidthParity, whose
      # expected costs were recorded on amd64. The compositors and the NEON
      # kernel now round at the same points on every target, so both pass.
      # See docs/known-limitations.md for the analysis and the reproduction
      # recipe, which needs no ARM64 hardware.

      - name: Record native scalar and SIMD throughput
        env:
          CGO_ENABLED: "0"
          CIRCLEFIT_REQUIRE_SIMD_TIER: ${{ matrix.tier }}
        run: go test -run '^$' -bench '^BenchmarkFastSSD_Comparison$' -benchtime=200ms -count=1 ./internal/fit
