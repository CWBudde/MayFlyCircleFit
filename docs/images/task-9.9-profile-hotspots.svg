<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Phase 9 CPU profile hotspot comparison</title>
  <desc id="desc">Simplified flame views compare flat CPU sample shares before optimization and on the optimized 12-thread renderer.</desc>
  <rect width="1440" height="720" fill="#111827"/>
  <text x="720" y="48" text-anchor="middle" fill="#f9fafb" font-family="sans-serif" font-size="30" font-weight="700">CPU profile hotspot shift</text>
  <text x="720" y="78" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="16">512×512 · 100 circles · simplified flame view of flat sample share</text>

  <g transform="translate(70 125)" font-family="sans-serif">
    <text x="0" y="0" fill="#f9fafb" font-size="22" font-weight="600">Baseline · 3650d61</text>
    <text x="1250" y="0" text-anchor="end" fill="#9ca3af" font-size="15">16.34 s sampled</text>
    <rect x="0" y="35" width="1250" height="70" rx="4" fill="#b91c1c"/>
    <text x="18" y="77" fill="#fff" font-size="19" font-weight="600">compositePixel · 57.34%</text>
    <rect x="0" y="110" width="278" height="58" rx="4" fill="#dc2626"/>
    <text x="14" y="146" fill="#fff" font-size="16">math.Round · 12.73%</text>
    <rect x="283" y="110" width="274" height="58" rx="4" fill="#ea580c"/>
    <text x="297" y="146" fill="#fff" font-size="16">renderCircle · 12.55%</text>
    <rect x="562" y="110" width="172" height="58" rx="4" fill="#f97316"/>
    <text x="576" y="146" fill="#fff" font-size="15">Float64bits · 7.89%</text>
    <rect x="739" y="110" width="71" height="58" rx="4" fill="#fb923c"/>
    <text x="747" y="135" fill="#fff" font-size="12">Set</text><text x="747" y="151" fill="#fff" font-size="12">3.24%</text>
    <rect x="815" y="110" width="137" height="58" rx="4" fill="#fdba74"/>
    <text x="829" y="146" fill="#431407" font-size="15">Other · 6.25%</text>
    <rect x="0" y="173" width="1250" height="44" rx="4" fill="#7f1d1d"/>
    <text x="18" y="201" fill="#fff" font-size="16">Render benchmark · 99.39% cumulative</text>
  </g>

  <g transform="translate(70 405)" font-family="sans-serif">
    <text x="0" y="0" fill="#f9fafb" font-size="22" font-weight="600">Optimized · f63599e · 12 threads</text>
    <text x="1250" y="0" text-anchor="end" fill="#9ca3af" font-size="15">41.04 CPU-s sampled over 13.65 s wall time</text>
    <rect x="0" y="35" width="1250" height="70" rx="4" fill="#15803d"/>
    <text x="18" y="77" fill="#fff" font-size="19" font-weight="600">compositePixel · 83.48%</text>
    <rect x="0" y="110" width="223" height="58" rx="4" fill="#16a34a"/>
    <text x="14" y="136" fill="#fff" font-size="15">renderCircleScanlineRows</text><text x="14" y="155" fill="#fff" font-size="15">14.89%</text>
    <rect x="228" y="110" width="24" height="58" rx="4" fill="#4ade80"/>
    <rect x="257" y="110" width="15" height="58" rx="4" fill="#86efac"/>
    <text x="288" y="146" fill="#bbf7d0" font-size="15">All other flat samples · 1.63%</text>
    <rect x="0" y="173" width="1250" height="44" rx="4" fill="#14532d"/>
    <text x="18" y="201" fill="#fff" font-size="16">Parallel render workers · 98.73% cumulative</text>
  </g>

  <text x="720" y="675" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="15">Rounding, Float64bits, image.Set, and per-render allocation leave the hot path; compositing becomes the dominant remaining target.</text>
</svg>
