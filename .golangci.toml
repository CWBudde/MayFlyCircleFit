version = '2'

[linters]
default = 'all'
disable = [
  'depguard',
  'exhaustive',
  'exhaustruct',
  'exhaustruct_v5',
  'gomodguard',
  'godox',
  'ireturn',
  'mnd',
  'musttag',
  'nlreturn',
  'sqlclosecheck',
  'wsl',
]
enable = ['gomodguard_v2', 'wsl_v5']

[linters.settings]
[linters.settings.tagliatelle]
[linters.settings.tagliatelle.case]
[linters.settings.tagliatelle.case.rules]
json = 'camel'

[linters.settings.varnamelen]
# Short names that are idiomatic in the renderer, optimizer and server packages.
ignore-names = ['x', 'y', 'w', 'h', 'r', 'g', 'b', 'a', 'dx', 'dy', 'i', 'j', 'n', 'id', 'ok', 'mu', 'wg']
ignore-decls = ['w http.ResponseWriter', 'r *http.Request', 'c Circle', 't testing.T', 'b testing.B']

[linters.settings.wsl_v5]
allow-first-in-block = true
allow-whole-block = false
branch-max-lines = 2
disable = ['decl']

[linters.exclusions]
generated = 'lax'
presets = ['comments', 'common-false-positives', 'legacy', 'std-error-handling']
paths = ['third_party$', 'builtin$', 'examples$']

[[linters.exclusions.rules]]
linters = ['gosec']
text = 'G601:'

# Cobra commands legitimately use package-level command variables and init().
[[linters.exclusions.rules]]
linters = ['gochecknoglobals', 'gochecknoinits']
path = 'cmd/.*\.go'

[[linters.exclusions.rules]]
linters = ['err113', 'wrapcheck']
path = 'cmd/.*\.go'

# Tests may use dynamic errors, long functions and package-level fixtures.
[[linters.exclusions.rules]]
linters = ['err113', 'wrapcheck', 'funlen', 'dupl', 'gochecknoglobals', 'maintidx', 'cyclop', 'gocognit']
path = '_test\.go'

# Generated templ output is committed; only its handwritten siblings are linted.
[[linters.exclusions.rules]]
path = '_templ\.go'
linters = ['all']

[severity]
default = 'warn'

[[severity.rules]]
linters = ['exhaustive', 'exhaustruct', 'exhaustruct_v5', 'godox']
severity = 'info'

[formatters]
enable = ['gci', 'gofumpt', 'goimports']

[formatters.exclusions]
generated = 'lax'
paths = ['third_party$', 'builtin$', 'examples$']
